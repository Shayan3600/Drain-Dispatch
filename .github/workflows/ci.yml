name: Verify DrainDispatch
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Scan history with Gitleaks (fully redacted)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all
      - run: npm ci
      - run: npm run security:scan
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build production Docker image without private files
        run: docker build --tag draindispatch:ci .
      - name: Verify production runtime dependencies
        run: |
          docker run --rm --entrypoint node draindispatch:ci --input-type=module -e '
            const fs = await import("node:fs");
            for (const dir of [".", "server", "client"])
              if (fs.readdirSync(dir).some(name => /(?:^\.env(?:\.|$)|credentials)/i.test(name)))
                throw new Error("Private configuration must not enter the production image");
            await import("./server/dist/config.js");
            await import("./server/dist/photon/worker.js");
            await import("@google/genai");
            await import("cloudinary");
            await import("pg");
            const sharp = (await import("sharp")).default;
            const bytes = await sharp({create:{width:1,height:1,channels:3,background:"white"}}).jpeg().toBuffer();
            if (!bytes.length) throw new Error("Production JPEG processing failed");
            console.log("Compiled worker and cloud/image dependencies load without provider requests");
          '
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=high
